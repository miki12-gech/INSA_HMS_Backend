spring:
  application:
    name: hms-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/insa_hospital
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        globally_quoted_identifiers: false
# ─────────────────────────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# ─────────────────────────────────────────────────────────────
# JWT CONFIGURATION
# Replace the secret with a securely generated 256-bit Base64 string
# before moving to production (e.g.: openssl rand -base64 32)
# ─────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:aG9zcGl0YWwtbWFuYWdlbWVudC1zeXN0ZW0tc2VjcmV0LWtleS1taWdyYXRpb24tcHJvamVjdC1tdXN0LWJlLWxvbmc=}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
# ─────────────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────────────
logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_BINDER:TRACE}
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}
    com.insa.hospital: ${LOG_LEVEL_APP:DEBUG}
